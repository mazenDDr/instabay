name: Offline quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Install locked Python and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          make setup
      - name: Lint and test without network, keys, or GPU
        run: make lint test
        env:
          UV_OFFLINE: "1"
          INSTABAY_MODE: dry_run
      - name: Scan tracked files and verify hooks
        run: uv run --offline --no-sync pre-commit run --all-files
  clone-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare validation image from a clean checkout
        run: docker build -f Dockerfile.validation -t instabay:validation .
      - name: Run setup, persistent approval stop and tests without network
        run: docker run --rm --network none instabay:validation

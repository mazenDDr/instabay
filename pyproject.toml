[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "instabay-agent"
version = "0.1.0"
description = "An approval-first bilingual Instagram marketing system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.12,<3",
  "pyyaml>=6,<7",
  "sqlmodel>=0.0.27,<0.1",
  "typer>=0.20,<1",
]

[project.scripts]
instabay = "instabay.cli:app"

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "hypothesis>=6.140,<7",
  "mypy>=1.18,<2",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<9",
  "pytest-socket>=0.7,<1",
  "ruff>=0.14,<1",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/instabay", "sim"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py", "*.pyi", "pyproject.toml"]
extend-exclude = [".tools", ".uv-cache", ".uv-python", ".pre-commit-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["ا", "ه"]

[tool.ruff.lint.isort]
known-first-party = ["instabay", "sim", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "config", "sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --strict-markers -ra"
markers = ["determinism: offline artifact determinism checks"]

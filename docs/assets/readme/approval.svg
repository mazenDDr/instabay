<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-labelledby="t d">
  <title id="t">A post's approval states</title>
  <desc id="d">Every generated post waits for the owner. Approve or edit-and-approve allows publishing for that exact content; reject needs a reason, which becomes a lesson for the next week's writers. Undo decision appends a REVOKED record and the post waits again. Nothing is ever overwritten.</desc>
  <style>
    .bg { fill: #ffffff; } .st { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .go { fill: #e9f7ee; stroke: #3fa35b; stroke-width: 1.5; } .stop { fill: #fdecee; stroke: #d1242f; stroke-width: 1.5; } .wait { fill: #fff4dc; stroke: #d08a00; stroke-width: 2; }
    .t { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .s { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .e { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .line { stroke: #8c959f; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; } .st { fill: #161b22; stroke: #30363d; } .go { fill: #10261a; } .stop { fill: #2c1215; stroke: #f85149; } .wait { fill: #2b2111; stroke: #e3a32e; }
      .t { fill: #e6edf3; } .s, .e { fill: #9198a1; } .line { stroke: #6e7681; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8c959f"/></marker></defs>
  <rect class="bg" width="1000" height="280" rx="16"/>
  <g transform="translate(20 100)"><rect class="wait" width="170" height="80" rx="12"/><text class="t" x="14" y="30">Needs approval</text><text class="s" x="14" y="52">checks + review notes</text><text class="s" x="14" y="68">shown in the drawer</text></g>
  <path class="line" d="M 190 120 C 260 60 300 50 356 52"/><text class="e" x="196" y="84">Approve</text>
  <path class="line" d="M 190 140 C 270 140 300 140 356 140"/><text class="e" x="200" y="132">Edit + approve</text>
  <path class="line" d="M 190 160 C 260 220 300 228 356 228"/><text class="e" x="196" y="206">Reject + reason</text>
  <g transform="translate(360 22)"><rect class="go" width="190" height="64" rx="12"/><text class="t" x="14" y="28">APPROVED</text><text class="s" x="14" y="48">bound to the content hash</text></g>
  <g transform="translate(360 108)"><rect class="go" width="190" height="64" rx="12"/><text class="t" x="14" y="28">EDITED</text><text class="s" x="14" y="48">your text + a saved diff</text></g>
  <g transform="translate(360 196)"><rect class="stop" width="190" height="64" rx="12"/><text class="t" x="14" y="28">REJECTED</text><text class="s" x="14" y="48">reason stored</text></g>
  <path class="line" d="M 550 52 C 610 52 620 90 676 96"/>
  <path class="line" d="M 550 140 C 610 140 620 110 676 106"/>
  <g transform="translate(680 64)"><rect class="st" width="140" height="80" rx="12"/><text class="t" x="14" y="30">Publish</text><text class="s" x="14" y="52">dry run or live,</text><text class="s" x="14" y="68">once, idempotent</text></g>
  <path class="line" d="M 550 140 C 620 200 620 228 676 228"/>
  <path class="line" d="M 550 228 L 676 228"/>
  <g transform="translate(680 196)"><rect class="st" width="300" height="64" rx="12"/><text class="t" x="14" y="28">Feedback memory</text><text class="s" x="14" y="48">reasons → "avoid", edits → "prefer" notes</text></g>
  <path class="line" d="M 360 34 C 250 30 120 30 105 96"/><text class="e" x="20" y="24">Undo decision → REVOKED: the post waits again</text>
</svg>

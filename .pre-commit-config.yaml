repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format check
        entry: .venv/bin/ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy strict
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: detect-secrets
        name: detect secrets
        entry: .venv/bin/detect-secrets-hook
        # Public SHA-256 fixture/protocol hashes are canonical-content metadata, not credentials.
        # Exempt only their exact JSON line shape; the rest of each fixture stays scanned.
        args: [--no-verify, --exclude-lines, '^\s*"(content_signature|brand_hash|protocol_hash|corpus_hash)": "[a-f0-9]{64}",?$']
        language: system
        exclude: ^(uv\.lock|assets/photos/manifest\.json)$

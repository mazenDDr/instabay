repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format check
        entry: .venv/bin/ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy strict
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: detect-secrets
        name: detect secrets
        entry: .venv/bin/detect-secrets-hook
        # Exempt exact canonical hash fields and public model revisions, never credential fields.
        # Native evidence files retain scanning on every other line.
        args:
          - --no-verify
          - --exclude-lines
          - '^\s*(?:"(content_hash|context_hash|visual_brief|grounded_copy_en|grounded_copy_ar|video_director|content_signature|brand_hash|brief_hash|motion_recipe_hash|protocol_hash|corpus_hash|sha256|recipe_hash|recipe_file_sha256|native_recipe_hash|raw_clip_sha256|contact_sha256|file_sha256|raw_copy_sha256|edited_copy_sha256|conditioning_sha256|image_sha256|ffmpeg_sha256|ffprobe_sha256|implementation_sha256|prompt_hash|cache_key)": "[a-f0-9]{64}"|"revision": "[a-f0-9]{40}"),?$|^\s*(?:sha256|motion_recipe_hash): (?:[a-f0-9]{64}|"[a-f0-9]{64}")$'
        language: system
        exclude: ^(uv\.lock|assets/photos/manifest\.json)$
